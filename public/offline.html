<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال | عيادتي</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7f7;
        font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        border: 1px solid #e2e8f0;
      }
      .mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #0f766e;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        margin: 0 auto 14px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.7;
        color: #64748b;
        margin: 0 0 8px;
      }
      ul {
        text-align: right;
        font-size: 13px;
        color: #475569;
        margin: 12px 0 0;
        padding-inline-start: 20px;
      }
      button {
        margin-top: 18px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #0f766e;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card" role="alert">
      <div class="mark">ع</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>يمكنك متابعة العمل على المسودات المحفوظة على جهازك، وستتزامن البيانات عند عودة الاتصال.</p>
      <ul>
        <li>الزيارات غير المحفوظة تُحفظ كمسودة محلية تلقائياً.</li>
        <li>الصفحات التي زرتها سابقاً متاحة من الذاكرة المؤقتة.</li>
        <li>تأكد من الاتصال ثم أعد المحاولة.</li>
      </ul>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
